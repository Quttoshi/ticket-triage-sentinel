services:
  - type: web
    name: ticket-triage-sentinel
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: MODEL_PROVIDER
        value: openai
      - key: MODEL_NAME
        value: gpt-4.1-mini
      - key: ALLOWED_MODELS
        value: gpt-4.1-mini,gpt-4.1-nano
      - key: OPENAI_API_KEY
        sync: false
